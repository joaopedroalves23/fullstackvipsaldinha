  <main class="main">
    <div class="container">
      <section class="contact">
        <form action="">
          <fieldset>
            <legend>Dados pessoais</legend>

            <div class="input-group">
              <label for="name">Nome</label>
              <input type="text" name="name" id="name" placeholder="Digite seu nome completo" required />
            </div>

            <div class="input-group">
              <label for="lastname">Sobrenome</label>
              <input type="text" name="lastname" id="lastname" placeholder="Digite seu nome completo" required />
            </div>

            <div class="input-group">
              <label for="email">E-mail: *</label>
              <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required />
            </div>

            <div class="input-group">
              <label for="whatsapp">Digite seu número</label>
              <input type="tell" name="whatsapp" id="whatsapp" placeholder="Digite seu número" required />
            </div>

            <div class="input-group">
              <label for="message">Mensagem:</label>
              <textarea name="message" id="message"></textarea>
            </div>

            <div class="input-group">
              <input type="submit" id="btn-submit" value="Enviar" />
            </div>
          </fieldset>
        </form>
      </section>
    </div>
  </main>

  <footer id="footer">
    <p>&copy; 2026 Brechó do xuru - Todos os direitos reservados.</p>
  </footer>

  <script>
    function maskPhone(value) {
      const digits = value.replace(/\D/g, "").slice(0, 11);

      if (digits.length <= 2) return digits.replace(/(\d{1,2})/, "($1");
      if (digits.length <= 3)
        return digits.replace(/(\d{2})(\d{1})/, "($1) $2");
      if (digits.length <= 7)
        return digits.replace(/(\d{2})(\d{1})(\d{1,4})/, "($1) $2 $3");
      return digits.replace(/(\d{2})(\d{1})(\d{4})(\d{1,4})/, "($1) $2 $3-$4");
    }

    const PHONE_REGEX = /^\(\d{2}\) 9 \d{4}-\d{4}$/;
    const PHONE_LENGTH = 16;

    const whatsappInput = document.getElementById("whatsapp");
    whatsappInput.addEventListener("input", e => {
      e.target.value = maskPhone(e.target.value);

      const isComplete = e.target.value.length === PHONE_LENGTH;
      const isValid = PHONE_REGEX.test(e.target.value);

      e.target.setCustomValidity(
        isComplete && !isValid
          ? "Número inválido. Celulares brasileiros começam com 9 após o DDD. Ex: (11) 9 8765-4321"
          : "",
      );
    });

    const contactForm = document.getElementById("contact-form");

    contactForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const lastname = document.getElementById("lastname").value.trim();
      const whatsapp = document.getElementById("whatsapp").value.trim();
      const message = document.getElementById("message").value.trim();

      const content = [
        "Dados do Formulario de Contato",
        "------------------------------",
        "Nome: " + name,
        "Sobrenome: " + lastname,
        "WhatsApp: " + whatsapp,
        "Mensagem: " + message,
      ].join("\n");

      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const fileUrl = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = fileUrl;
      link.download = "contato.txt";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(fileUrl);
      contactForm.reset();
    });
  </script>
</body>
